<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="Cover letter of Ignacio Smail"
  />

  <title>Ignacio Smail Cover Letter</title>

  <link rel="stylesheet" href="cover-letter.css" />

  <script
    type="module"
    src="cover-letter.js"
  ></script>
</head>

<body>
  <div
    class="cover-controls"
    data-print-hidden
  >
    <div class="cover-controls__group">
      <button
        type="button"
        class="cover-control-button active"
        data-language-button="en"
      >
        English
      </button>

      <button
        type="button"
        class="cover-control-button"
        data-language-button="es"
      >
        Español
      </button>
    </div>

    <div class="cover-controls__group">
      <button
        type="button"
        class="cover-control-button"
        id="print-cover-letter-button"
      >
        Print / Save PDF
      </button>
    </div>
  </div>

  <main
    class="cover-page"
    id="cover-page"
  >
    <header class="cover-header">

      <div class="cover-header__identity">
        <div
          class="cover-monogram"
          aria-hidden="true"
        >
          IS
        </div>

        <div>
          <p class="cover-kicker">
            COVER LETTER
          </p>

          <h1 id="cover-name">
            Ignacio Smail
          </h1>

          <p
            class="cover-professional-title"
            id="cover-professional-title"
          >
            Data & Digital Solutions Analyst | Project Leader
          </p>

          <p
            class="cover-professional-subtitle"
            id="cover-professional-subtitle"
          >
            Industrial Engineering · Data · Automation · Business Intelligence
          </p>
        </div>
      </div>

      <div
        class="cover-contact"
        id="cover-contact"
      >
        <!-- Se completa desde cover-letter.js -->
      </div>

    </header>

    <section class="cover-body">



      <div class="cover-subject">
        <span
          class="cover-meta-label"
          id="cover-subject-label"
        >
          Subject
        </span>

        <h2 id="cover-subject">
          Application for Position Title
        </h2>
      </div>

      <article
        class="cover-letter-content"
        id="cover-letter-content"
      >
        <!-- Se completa desde cover-letter.js -->
      </article>

      <div class="cover-signature">
        <p id="cover-signature-text">
          Sincerely,
        </p>

        <strong id="cover-signature-name">
          Ignacio Smail
        </strong>
      </div>

    </section>

    <footer class="cover-footer">

      <a
        id="cover-portfolio-link"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Explore the interactive portfolio
      </a>

      <span id="cover-footer-language">
        English version
      </span>

    </footer>
  </main>
</body>
</html>
