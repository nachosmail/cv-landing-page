<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ATS-friendly curriculum vitae of Ignacio Smail" />
  <title>Ignacio Smail - ATS CV</title>
  <link rel="stylesheet" href="ats.css" />
  <script type="module" src="ats.js"></script>
</head>
<body>
  <main class="resume" id="resume">
    <header class="resume-header">
      <h1 id="name"></h1>
      <p class="professional-title" id="professional-title"></p>
      <p class="professional-subtitle" id="professional-subtitle"></p>
      <p class="contact-line" id="contact-line"></p>
      <p class="link-line" id="link-line"></p>
    </header>

    <section>
      <h2 id="profile-title"></h2>
      <div id="profile"></div>
    </section>

    <section>
      <h2 id="competencies-title"></h2>
      <p class="keyword-list" id="competencies"></p>
    </section>

    <section>
      <h2 id="experience-title"></h2>
      <div id="experience"></div>
    </section>

    <section>
      <h2 id="solutions-title"></h2>
      <div id="solutions"></div>
    </section>

    <section>
      <h2 id="tools-title"></h2>
      <p class="keyword-list" id="tools"></p>
    </section>

    <section class="two-column-text">
      <div>
        <h2 id="education-title"></h2>
        <div id="education"></div>
      </div>
      <div>
        <h2 id="languages-title"></h2>
        <div id="languages"></div>
      </div>
    </section>
  </main>
</body>
</html>
